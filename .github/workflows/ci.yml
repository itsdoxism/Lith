name: CI

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Require bundled trusted seed
        run: |
          test -f bootstrap/seed/lithc-linux-x86_64 || {
            echo 'bootstrap/seed/lithc-linux-x86_64 is required'
            exit 1
          }
          chmod +x bootstrap/seed/lithc-linux-x86_64
      - name: Build and test Lith from trusted seed
        run: make test
      - name: Verify native self-rebuild
        run: make native-rebuild
      - name: Export verified seed candidate
        run: make seed-export
      - name: Record seed SHA-256
        run: |
          cd bootstrap/seed
          sha256sum lithc-linux-x86_64 > SHA256SUMS
      - name: Upload verified seed artifact
        uses: actions/upload-artifact@v4
        with:
          name: lith-seed-linux-x86_64-${{ github.sha }}
          path: |
            bootstrap/seed/lithc-linux-x86_64
            bootstrap/seed/manifest.txt
            bootstrap/seed/SHA256SUMS
          if-no-files-found: error
          retention-days: 30
